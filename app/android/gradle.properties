org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# AGP 9.x built-in Kotlin + new DSL (the Flutter-template transitional flags
# android.newDsl=false / android.builtInKotlin=false are deprecated and their
# legacy script-compilation path cannot assemble a kotlin-stdlib classpath on a
# cold Kotlin DSL cache with AGP 9.1/Gradle 9.3.1).
android.injected.build.abi=arm64-v8a
android.injected.testOnly=false
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
