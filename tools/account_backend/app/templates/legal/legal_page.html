<!doctype html>
<html lang="{{ lang }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ title }} - RetroEmuPouch 趣玩匣</title>
  <style>
    :root { color-scheme: light dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
        "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      line-height: 1.7; color: #1f2328; background: #f6f8fa;
    }
    .wrap { max-width: 820px; margin: 0 auto; padding: 2rem 1.25rem 4rem; }
    .card {
      background: #fff; border: 1px solid #e3e6ea; border-radius: 12px;
      padding: 2rem 2.25rem; box-shadow: 0 1px 3px rgba(0,0,0,.04);
    }
    h1 { font-size: 1.6rem; margin: 0 0 .25rem; }
    h2 { font-size: 1.15rem; margin: 1.75rem 0 .5rem; border-left: 4px solid #4c8bf5; padding-left: .6rem; }
    h3 { font-size: 1rem; margin: 1.2rem 0 .4rem; }
    p, li { font-size: .95rem; }
    blockquote {
      margin: .75rem 0; padding: .6rem .9rem; background: #fff8e6;
      border-left: 4px solid #f0c14b; border-radius: 6px; color: #6b5300;
    }
    a { color: #2563eb; }
    code { background: #f0f2f5; padding: .1rem .35rem; border-radius: 4px; }
    .meta { color: #6b7280; font-size: .85rem; margin: 0 0 1.5rem; }
    footer { text-align: center; color: #9ca3af; font-size: .82rem; margin-top: 2rem; }
    @media (prefers-color-scheme: dark) {
      body { color: #e6edf3; background: #0d1117; }
      .card { background: #161b22; border-color: #30363d; }
      blockquote { background: #2a2410; color: #e3c97a; border-left-color: #b8860b; }
      code { background: #21262d; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <h1>{{ title }}</h1>
      {% if updated %}<p class="meta">最后更新：{{ updated }}（版本 {{ version }}）</p>{% endif %}
      <article>{{ body | safe }}</article>
    </div>
    <footer>© RetroEmuPouch 趣玩匣 · 本页面由服务端动态渲染自 CMS 已发布文档</footer>
  </div>
</body>
</html>
